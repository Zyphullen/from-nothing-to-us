<style>
html,body{margin:0;height:100%;overflow:hidden;background:#04060f;color:#e8f4ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#sky{position:fixed;inset:0;z-index:0}
#tree{position:fixed;inset:0;z-index:1;width:100%;height:100%;cursor:grab;display:block}
#tree.drag{cursor:grabbing}
header{position:fixed;top:12px;left:14px;z-index:3;pointer-events:none;padding:8px 12px;border-radius:14px;background:rgba(4,8,20,.55)}
h1{margin:0;font-size:22px;font-weight:650;letter-spacing:.4px;background:linear-gradient(90deg,#ffd36b,#4ff3e3);-webkit-background-clip:text;background-clip:text;color:transparent}
.legend{margin-top:6px;display:flex;gap:12px;font-size:12.5px;color:#b9c8dc}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.k{background:#3dff8a;box-shadow:0 0 8px #3dff8a}.t{background:#ffa53d;box-shadow:0 0 8px #ffa53d}.u{background:#ff4d5e;box-shadow:0 0 8px #ff4d5e}
.zoom{position:fixed;left:14px;bottom:14px;z-index:3;display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;border-radius:12px;border:1px solid #23355a;background:rgba(10,18,36,.85);color:#9ff5ea;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.zoom button:hover{border-color:#4ff3e3}
#strip{position:fixed;right:10px;top:84px;bottom:24px;width:70px;z-index:3;cursor:pointer;border-radius:12px;overflow:hidden;background:rgba(6,10,24,.6);border:1px solid #1b2a48}
.seg{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;letter-spacing:.3px;color:#a9b9d2;border-top:1px solid rgba(255,255,255,.05)}
#vp{position:absolute;left:2px;right:2px;border:1.5px solid #ffd36b;border-radius:8px;background:rgba(255,211,107,.08);box-shadow:0 0 10px rgba(255,211,107,.35);pointer-events:none}
#pop{position:fixed;z-index:5;max-width:250px;padding:12px 30px 12px 14px;border-radius:14px;background:rgba(8,14,30,.95);border:1.5px solid #4ff3e3;display:none;font-size:14px;line-height:1.45;color:#d6e4f5}
#pop b{display:block;font-size:15.5px;color:#fff;margin-bottom:2px}
#pop .chip{font-size:11.5px;color:#9fb0c8;margin-bottom:6px}
#pop .chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
#pop .x{position:absolute;top:6px;right:8px;background:none;border:0;color:#8aa0bd;font-size:20px;cursor:pointer;padding:2px 4px}
.node{cursor:pointer}
.node .disc{transition:stroke-width .2s}
.node:hover .disc{stroke-width:3.5}
svg.focus .node:not(.lit){opacity:.22}
svg.focus .edge:not(.lit){opacity:.06}
.node,.edge{transition:opacity .35s}
@media (max-width:600px){header{padding:6px 9px;top:8px;left:8px}h1{font-size:16px}.legend{font-size:11.5px;gap:9px}#strip{width:22px;right:6px}.seg{font-size:0}}
</style>

  <h1>From Nothing to Us</h1>
  <div class="legend"><span><i class="k"></i>known</span><span><i class="t"></i>we think</span><span><i class="u"></i>unknown</span></div>

  <button id="zfit" title="See everything"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#9ff5ea" stroke-width="2" stroke-linecap="round"><path d="M3 8V3h5M14 3h5v5M19 14v5h-5M8 19H3v-5"/></svg></button>
  <button id="ztop" title="Back to the top"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#9ff5ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l6-6 6 6M11 6v12"/></svg></button>
</div>

<script>
'use strict';
/* ============ COLOURS ============ */
const SC = { k: '#3dff8a', t: '#ffa53d', u: '#ff4d5e' };           // known / we think / unknown
const SN = { k: 'Known science', t: 'We think so (leading idea)', u: 'Unknown' };
const T = '#4ff3e3', G = '#ffd36b', WH = '#e8f4ff';

/* ============ THE TREE (top = nothing, bottom = us) ============
   s: k = known/established, t = hypothesis/leading model, u = unknown
   p: parents ("builds / turns into" arrows come from these) */
const N = [
 {id:'nothing',r:0,x:620,s:'u',ic:'nothing',name:'Before the Big Bang?',line:'Why is there anything?',info:['Nobody knows yet.','Maybe there was no "before".'],p:[]},
 {id:'chain',r:1,x:300,s:'t',ic:'chain',name:'Chain Theory',line:'Space as linked qudits?',info:['Idea by Alex Wissner-Gross.','Space and matter from linked qudits.','New hypothesis, still being tested.'],p:['nothing']},
 {id:'field',r:1,x:620,s:'k',ic:'field',name:'Quantum fields',line:'Empty space still buzzes',info:['Every particle is a ripple in a field.','Tested extremely precisely.'],p:['nothing']},
 {id:'qgrav',r:1,x:940,s:'t',ic:'qgrav',name:'Quantum gravity',line:'Gravity at tiny scales?',info:['Joining gravity with quantum rules.','Ideas: strings, loops, chains…','None proven yet.'],p:['nothing']},
 {id:'qudits',r:2,x:300,s:'t',ic:'qudits',name:'Qudits & links',line:'Tiny units, paired links',info:['A qudit is a tiny quantum unit.','Pairs share entanglement links.','Each holds only a few links.'],p:['chain']},
 {id:'inflation',r:2,x:780,s:'t',ic:'inflation',name:'Inflation',line:'Super-fast first stretch',info:['Space grew hugely in a split second.','Fits what we see in the sky.','Leading model, not proven.'],p:['field','qgrav']},
 {id:'chainmail',r:3,x:220,s:'t',ic:'chainmail',name:'Chainmail particles',line:'Knotted links = matter?',info:['Tangled loops of links.','Might act like particles.','Part of Chain Theory.'],p:['qudits']},
 {id:'gap',r:3,x:450,s:'u',ic:'gap',name:'Chain → Standard Model',line:'The bridge is not known',info:['How chains would make quarks','and electrons is not worked out yet.'],p:['chainmail']},
 {id:'bigbang',r:3,x:700,s:'k',ic:'bigbang',name:'Hot Big Bang',line:'Hot, dense, expanding',info:['13.8 billion years ago.','Seen in the afterglow light.'],p:['inflation']},
 {id:'higgs',r:3,x:960,s:'k',ic:'higgs',name:'Higgs field',line:'Gives particles mass',info:['Its particle was found in 2012.','Particles "drag" in it = mass.'],p:['field']},
 {id:'quarks',r:4,x:220,s:'k',ic:'quarks',name:'Quarks & gluons',line:'Glued by strong force',info:['Quarks make protons and neutrons.','Gluons hold them together.'],p:['bigbang','gap','higgs']},
 {id:'electrons',r:4,x:380,s:'k',ic:'electron',name:'Electrons',line:'Tiny negative charges',info:['Found in 1897.','They surround atoms, carry electricity.'],p:['bigbang','gap','higgs']},
 {id:'photons',r:4,x:540,s:'k',ic:'photon',name:'Photons',line:'Particles of light',info:['Light, radio, X-rays: all photons.','They carry the electric force.'],p:['bigbang','gap']},
 {id:'neutrinos',r:4,x:700,s:'k',ic:'neutrino',name:'Neutrinos',line:'Ghosts that pass through',info:['Trillions pass through you each second.','They almost never hit anything.'],p:['bigbang']},
 {id:'dm',r:4,x:860,s:'t',ic:'darkmatter',name:'Dark matter',line:'Unseen mass. A particle?',info:['About 5× more than normal matter.','We see its pull, not the stuff.','What it is: still a guess.'],p:['bigbang']},
 {id:'de',r:4,x:1020,s:'u',ic:'darkenergy',name:'Dark energy',line:'Pushes space apart. Why?',info:['About 70% of the universe.','Makes expansion speed up.','What it is: unknown.'],p:['bigbang']},
 {id:'hadrons',r:5,x:260,s:'k',ic:'hadrons',name:'Protons & neutrons',line:'Three quarks each',info:['Proton = 2 up + 1 down quark.','Formed in the first second.'],p:['quarks']},
 {id:'nuclei',r:6,x:300,s:'k',ic:'nuclei',name:'First nuclei',line:'Hydrogen & helium cores',info:['Made in the first 3 minutes.','About 3/4 hydrogen, 1/4 helium.'],p:['hadrons']},
 {id:'atoms',r:7,x:380,s:'k',ic:'atom',name:'First atoms',line:'Nuclei catch electrons',info:['380,000 years after the Big Bang.','Space became see-through.'],p:['nuclei','electrons']},
 {id:'cmb',r:7,x:640,s:'k',ic:'cmb',name:'Afterglow (CMB)',line:'Oldest light we can see',info:['Light set free when atoms formed.','Now faint microwaves everywhere.'],p:['atoms','photons']},
 {id:'clouds',r:8,x:560,s:'k',ic:'clouds',name:'Gas clouds',line:'Gravity gathers gas',info:['Gas and dark matter clump.','Clouds collapse to make stars.'],p:['atoms','dm']},
 {id:'firststars',r:9,x:340,s:'t',ic:'firststars',name:'First stars',line:'Huge, not yet seen',info:['Only hydrogen and helium.','Probably huge and short-lived.','Not directly seen yet.'],p:['clouds']},
 {id:'stars',r:9,x:560,s:'k',ic:'star',name:'Stars',line:'Squeezed gas ignites',info:['Gravity squeezes the core.','Hydrogen fuses into helium.','That is why stars shine.'],p:['clouds']},
 {id:'galaxies',r:9,x:800,s:'k',ic:'galaxy',name:'Galaxies',line:'Billions of stars swirl',info:['Milky Way: 100+ billion stars.','Billions of galaxies exist.'],p:['clouds','dm']},
 {id:'fusion',r:10,x:420,s:'k',ic:'fusion',name:'Fusion in stars',line:'Light atoms fuse heavier',info:['Helium → carbon → oxygen…','Up to iron in big stars.'],p:['firststars','stars']},
 {id:'supernova',r:10,x:660,s:'k',ic:'supernova',name:'Supernovae',line:'Stars explode, seed space',info:['Big stars explode when done.','They spread elements into space.','Star crashes make gold too.'],p:['stars']},
 {id:'bh',r:10,x:900,s:'k',ic:'blackhole',name:'Black holes',line:"Even light can't escape",info:['Left by some dead stars.','First photographed in 2019.'],p:['supernova','galaxies']},
 {id:'elements',r:11,x:520,s:'k',ic:'elements',name:'Heavier elements',line:'Carbon, oxygen, iron…',info:['Your carbon was made in stars.','"We are made of star stuff."'],p:['fusion','supernova','atoms']},
 {id:'molecules',r:12,x:360,s:'k',ic:'molecule',name:'Molecules',line:'Atoms share electrons',info:['Water, CO₂, methane…','Even found in space clouds.'],p:['elements']},
 {id:'dust',r:12,x:680,s:'k',ic:'dust',name:'Dust & disks',line:'Rings around young stars',info:['Gas and dust circle new stars.','Telescopes see them today.'],p:['elements','stars']},
 {id:'planets',r:13,x:600,s:'k',ic:'planet',name:'Planets',line:'Dust clumps into worlds',info:['Dust sticks into rocks, then worlds.','Giants also grab gas.'],p:['dust']},
 {id:'solar',r:13,x:860,s:'k',ic:'solar',name:'Solar system',line:'Our Sun and its family',info:['Formed 4.6 billion years ago.','8 planets around the Sun.'],p:['dust']},
 {id:'earth',r:14,x:620,s:'k',ic:'earth',name:'Earth',line:'Rocky, wet, just right',info:['Right distance for liquid water.','Has a magnetic shield.'],p:['planets','solar']},
 {id:'exo',r:14,x:900,s:'k',ic:'exo',name:'Other worlds',line:'Thousands found so far',info:['5,000+ planets around other stars.','Some might have water.'],p:['planets']},
 {id:'water',r:15,x:480,s:'k',ic:'water',name:'Water & oceans',line:'Early Earth gets wet',info:['Oceans by ~4.4 billion years ago.','Water lets chemistry happen.'],p:['molecules','earth']},
 {id:'chem',r:16,x:520,s:'k',ic:'flask',name:'Rich chemistry',line:'Vents, lightning, sun',info:['Energy from vents, lightning, sun','builds new molecules.'],p:['water','earth']},
 {id:'amino',r:17,x:520,s:'k',ic:'amino',name:"Life's building blocks",line:'Amino acids & bases',info:['They form in lab experiments.','Also found in meteorites.'],p:['chem']},
 {id:'rna',r:18,x:520,s:'t',ic:'rna',name:'RNA world',line:'RNA copied itself first?',info:['RNA can store info and do work.','Maybe it came before DNA.','Leading idea, not proven.'],p:['amino']},
 {id:'origin',r:19,x:520,s:'u',ic:'spark',name:'The first spark',line:'Chemistry → alive: how?',info:['The exact step from chemistry','to living cells is unknown.'],p:['rna']},
 {id:'cells',r:20,x:520,s:'k',ic:'cell',name:'First cells',line:'A skin around a copier',info:['About 3.5–4 billion years ago.','Simple cells, no nucleus.','Like bacteria today.'],p:['origin']},
 {id:'dna',r:21,x:360,s:'k',ic:'dna',name:'DNA',line:"Life's recipe book",info:['Double helix, found in 1953.','Stores instructions for life.'],p:['cells','rna']},
 {id:'photosyn',r:21,x:700,s:'k',ic:'leaf',name:'Photosynthesis',line:'Sunlight → food + oxygen',info:['Tiny cells filled the air with oxygen.','Later, complex life could breathe it.'],p:['cells']},
 {id:'eukaryote',r:22,x:520,s:'k',ic:'eukaryote',name:'Complex cells',line:'Cells with a nucleus',info:['One cell swallowed another.','It became the mitochondria.'],p:['cells','photosyn']},
 {id:'multicell',r:23,x:520,s:'k',ic:'multicell',name:'Many-celled life',line:'Cells team up',info:['Cells stick together and specialise.','It happened many times.'],p:['eukaryote']},
 {id:'plants',r:24,x:340,s:'k',ic:'plant',name:'Plants',line:'Green, sun-powered',info:['On land ~470 million years ago.','Make the oxygen we breathe.'],p:['multicell','photosyn']},
 {id:'animals',r:24,x:680,s:'k',ic:'fish',name:'Animals',line:'Move, eat, sense',info:['Over 500+ million years.','Shaped by evolution.'],p:['multicell']},
 {id:'human',r:25,x:680,s:'k',ic:'human',name:'Human body',line:'~37 trillion cells',info:['Built from DNA instructions.','Cells → tissues → organs.'],p:['animals']},
 {id:'organs',r:26,x:520,s:'k',ic:'heart',name:'Organs',line:'Heart, lungs, gut…',info:['Each organ does one big job.','They all work as a team.'],p:['human']},
 {id:'brain',r:26,x:840,s:'k',ic:'brain',name:'Brain',line:'86 billion neurons',info:['Trillions of connections.','Thinks, feels, remembers.'],p:['human']},
 {id:'mind',r:27,x:840,s:'u',ic:'mind',name:'Consciousness',line:'Why it feels: unknown',info:['How brain activity becomes feeling','is one of the biggest unknowns.'],p:['brain']},
];
const BANDS = [ // rough size scale of each part of the tree (rows)
 ['quantum',-0.6,5.5,'#4ff3e3'],['atomic',5.5,7.5,'#7fc8ff'],['cosmic',7.5,11.5,'#c9b6ff'],['planetary',11.5,15.5,'#ffd36b'],
 ['molecular',15.5,19.5,'#ffb46b'],['cellular',19.5,23.5,'#5cf0a0'],['human',23.5,27.6,'#ff9ad5']];
const ROW = 178, TOP = 110, W = 1240, H = TOP + 27 * ROW + 140;
const Y = r => TOP + r * ROW;
const byId = {}; N.forEach(n => { n.y = Y(n.r); n.kids = []; byId[n.id] = n; });
N.forEach(n => n.p.forEach(p => byId[p].kids.push(n.id)));

/* ============ HAND-DRAWN ICONS (centred on 0,0, about 50 units wide) ============ */
const st = (c, w = 2) => `fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
function wave(x1, y1, x2, y2, amp, n) { const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L; let d = '';
  for (let i = 0; i <= 40; i++) { const t = i / 40, o = amp * Math.sin(t * n * 2 * Math.PI); d += (i ? 'L' : 'M') + (x1 + dx * t + nx * o).toFixed(1) + ' ' + (y1 + dy * t + ny * o).toFixed(1); } return d; }
const circ = (x, y, r, a) => `<circle cx="${x}" cy="${y}" r="${r}" ${a}/>`;
const line = (x1, y1, x2, y2, a) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${a}/>`;
const fill = c => `fill="${c}"`;
function rays(n, r1, r2, c, w = 2, off = 0) { let s = ''; for (let i = 0; i < n; i++) { const a = off + i * 2 * Math.PI / n; s += line((Math.cos(a) * r1).toFixed(1), (Math.sin(a) * r1).toFixed(1), (Math.cos(a) * r2).toFixed(1), (Math.sin(a) * r2).toFixed(1), st(c, w)); } return s; }
function lcg(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const hex = (cx, cy, r) => 'M' + [0, 1, 2, 3, 4, 5].map(i => { const a = Math.PI / 6 + i * Math.PI / 3; return (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1); }).join('L') + 'Z';
const ICON = {
 nothing: () => circ(0, 0, 22, `fill="#000" stroke="#555" stroke-width="2" stroke-dasharray="3 4"`) + `<text y="10" text-anchor="middle" font-size="28" font-weight="700" fill="#777">?</text>`,
 field: () => [-12, 0, 12].map((y, i) => `<path d="M-26 ${y} q6.5 -8 13 0 t13 0 t13 0 t13 0" ${st(i === 1 ? G : T, 2.2)}/>`).join(''),
 qgrav: () => [-16, -6, 4, 14].map((y, i) => `<path d="M-26 ${y} Q0 ${y + 12 - i * 2} 26 ${y}" ${st('#b7a6ff', 1.6)}/>`).join('') + [-18, -6, 6, 18].map(x => `<path d="M${x} -20 Q${x * 0.6} 8 ${x} 22" ${st('#b7a6ff', 1.2)}/>`).join('') + circ(0, 5, 4, fill(G)),
 chain: () => { const P = [[-18, -10], [0, -20], [18, -10], [18, 10], [0, 20], [-18, 10]]; let s = '';
   P.forEach((p, i) => { const q = P[(i + 1) % 6]; s += line(p[0], p[1], q[0], q[1], st(T, 1.8)) + line(0, 0, p[0], p[1], st(T, 1.4)); });
   return s + [[0, 0], ...P].map(p => circ(p[0], p[1], 3.4, fill(G))).join(''); },
 qudits: () => { const pr = (x1, y1, x2, y2) => line(x1, y1 - 2, x2, y2 - 2, st(T, 1.6)) + line(x1, y1 + 2, x2, y2 + 2, st(T, 1.6));
   return pr(-16, -10, 16, -10) + pr(-16, 12, 16, 12) + line(-16, -10, -16, 12, st(T, 1.6)) + [[-16, -10], [16, -10], [-16, 12], [16, 12]].map(p => circ(p[0], p[1], 5, `fill="${G}" stroke="#fff6d0" stroke-width="1"`)).join(''); },
 chainmail: () => [[-8, -7], [8, -7], [-8, 8], [8, 8]].map((p, i) => circ(p[0], p[1], 10, st(i % 3 ? G : '#ffe9a8', 2.6))).join(''),
 gap: () => circ(-20, -4, 6, st(G, 2.2)) + circ(-13, 3, 6, st(G, 2.2)) + `<path d="M-5 0 L8 0" ${st(T, 2)} stroke-dasharray="2 4"/>` + circ(18, -6, 3.5, fill('#ff5f6d')) + circ(14, 4, 3.5, fill('#4cff8f')) + circ(22, 4, 3.5, fill('#4fa3ff')) + `<text x="2" y="-9" text-anchor="middle" font-size="15" font-weight="700" fill="#ff8a94">?</text>`,
 inflation: () => `<path d="M-26 -3 Q-10 -4 0 -9 T26 -24" ${st(T, 2.2)}/><path d="M-26 3 Q-10 4 0 9 T26 24" ${st(T, 2.2)}/>` + [[-20, 0, 1.5], [-9, 0, 2.2], [4, 0, 3.2], [18, 0, 4.4]].map(p => circ(p[0], p[1], p[2], fill(G))).join(''),
 bigbang: () => rays(12, 10, 25, G, 2, 0) + rays(12, 12, 19, T, 1.6, Math.PI / 12) + circ(0, 0, 7, fill('#fff6d0')),
 higgs: () => { let s = ''; for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) if (i || j) s += circ(i * 16, j * 16, 2.2, fill('#8fb4ff')); return s + circ(0, 0, 15, `${st(T, 1.4)} stroke-dasharray="3 3"`) + circ(0, 0, 7, fill(G)); },
 quarks: () => `<path d="${wave(0, -12, -12, 9, 2.5, 3)}" ${st(G, 1.4)}/><path d="${wave(-12, 9, 12, 9, 2.5, 3)}" ${st(G, 1.4)}/><path d="${wave(12, 9, 0, -12, 2.5, 3)}" ${st(G, 1.4)}/>` + circ(0, -12, 7, fill('#ff5f6d')) + circ(-12, 9, 7, fill('#4cff8f')) + circ(12, 9, 7, fill('#4fa3ff')),
 electron: () => circ(0, 0, 24, `${st('#7fc8ff', 1.4)} stroke-dasharray="2 5"`) + circ(0, 0, 15, `${st('#7fc8ff', 1.6)} stroke-dasharray="2 4"`) + circ(0, 0, 5.5, fill('#9fd8ff')),
 photon: () => `<path d="${wave(-24, 8, 16, -6, 5, 3)}" ${st('#fff17a', 2.4)}/><path d="M11 -14 L22 -9 L14 1" ${st('#fff17a', 2.4)}/>`,
 neutrino: () => `<path d="M-24 16 L12 -8" ${st('#9aa8c8', 2)} stroke-dasharray="1 5"/>` + circ(15, -10, 6, `${st('#d7e1ff', 1.6)} opacity=".8"`) + circ(15, -10, 2, fill('#d7e1ff')),

/* ============ BUILD THE SVG ============ */
const svg = document.getElementById('tree'), world = document.getElementById('world'), defs = document.getElementById('defs');
const RANK = { k: 0, t: 1, u: 2 }, RK = ['k', 't', 'u'];
defs.innerHTML = Object.entries(SC).map(([k, c]) =>
  `<radialGradient id="glow-${k}"><stop offset="0.5" stop-color="${c}" stop-opacity="${k === 'u' ? .22 : .38}"/><stop offset="0.68" stop-color="${c}" stop-opacity="${k === 'u' ? .08 : .14}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>` +
  `<marker id="arr-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L9 5 L0 9 Z" fill="${c}" opacity=".7"/></marker>`).join('') +
  `<filter id="sketch" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>` +
  `<radialGradient id="disc"><stop offset="0" stop-color="#14203d"/><stop offset="1" stop-color="#080e20"/></radialGradient>` +
  `<radialGradient id="discU"><stop offset="0" stop-color="#0d0b14"/><stop offset="1" stop-color="#030306"/></radialGradient>`;
let edges = '', nodes = '';
for (const n of N) for (const pid of n.p) { const p = byId[pid], s = RK[Math.max(RANK[n.s], RANK[p.s])];
  const x1 = p.x, y1 = p.y + 90, x2 = n.x, y2 = n.y - 50, dy = Math.max(14, (y2 - y1) * 0.55);
  edges += `<path class="edge" data-a="${pid}" data-b="${n.id}" d="M${x1} ${y1} C${x1} ${y1 + dy} ${x2} ${y2 - dy} ${x2} ${y2}" fill="none" stroke="${SC[s]}" stroke-opacity="${s === 'k' ? .45 : .6}" stroke-width="2.2" ${s === 'k' ? '' : 'stroke-dasharray="7 6"'} marker-end="url(#arr-${s})"/>`; }
for (const n of N) { const c = SC[n.s], u = n.s === 'u';
  nodes += `<g class="node" data-id="${n.id}" transform="translate(${n.x} ${n.y})">
    <circle r="74" fill="url(#glow-${n.s})"/>
    <circle class="disc" r="40" fill="url(#${u ? 'discU' : 'disc'})" stroke="${c}" stroke-width="2.4" ${u ? 'stroke-dasharray="5 4"' : ''}/>
    <g filter="url(#sketch)" ${u ? 'opacity=".45"' : ''}>${ICON[n.ic]()}</g>
    ${u ? `<path d="M-19 -19 L19 19 M19 -19 L-19 19" stroke="${c}" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>` : ''}
    <text y="64" text-anchor="middle" font-size="16.5" font-weight="650" fill="${u ? '#c9b3b8' : '#eef7ff'}" stroke="#04060f" stroke-width="4" paint-order="stroke">${n.name}</text>
    <text y="83" text-anchor="middle" font-size="12.5" fill="#8fa3bf" stroke="#04060f" stroke-width="3" paint-order="stroke">${n.line}</text>
  </g>`; }
world.innerHTML = `<g>${edges}</g><g>${nodes}</g>`;

/* ============ STARRY SKY ============ */
const sky = document.getElementById('sky'), sctx = sky.getContext('2d');
function drawSky() { const d = Math.min(2, devicePixelRatio || 1), w = innerWidth, h = innerHeight; sky.width = w * d; sky.height = h * d; sctx.setTransform(d, 0, 0, d, 0, 0);
  const g = sctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#060a1c'); g.addColorStop(1, '#02030a'); sctx.fillStyle = g; sctx.fillRect(0, 0, w, h);
  [[.2, .25, '79,243,227'], [.8, .7, '255,211,107'], [.6, .15, '170,140,255']].forEach(([x, y, c]) => { const r = Math.max(w, h) * .5, rg = sctx.createRadialGradient(x * w, y * h, 0, x * w, y * h, r);
    rg.addColorStop(0, `rgba(${c},.06)`); rg.addColorStop(1, `rgba(${c},0)`); sctx.fillStyle = rg; sctx.fillRect(0, 0, w, h); });
  const r = lcg(42), n = Math.round(w * h / 1800); for (let i = 0; i < n; i++) { const a = r() * r() * .9 + .08; sctx.fillStyle = `rgba(${r() < .15 ? '255,230,180' : r() < .3 ? '180,240,255' : '235,240,255'},${a})`;
    sctx.beginPath(); sctx.arc(r() * w, r() * h, r() < .04 ? 1.4 : .7, 0, 6.283); sctx.fill(); } }

const strip = document.getElementById('strip'), vp = document.getElementById('vp');
BANDS.forEach(([name, a, b, c]) => { const d = document.createElement('div'); d.className = 'seg'; const y0 = Math.max(0, Y(a)) / H, y1 = Math.min(H, Y(b)) / H;
  d.style.top = (y0 * 100) + '%'; d.style.height = ((y1 - y0) * 100) + '%'; d.style.background = `linear-gradient(90deg, ${c}22, ${c}08)`; d.style.boxShadow = `inset 3px 0 0 ${c}aa`; d.textContent = name; strip.insertBefore(d, vp); });

/* ============ PAN / ZOOM ============ */
let s = 1, tx = 0, ty = 0, anim = null;
const MAXS = 3.5, minS = () => Math.min(innerWidth / (W + 60), innerHeight / (H + 60)) * 0.92;
function clamp() { const vw = innerWidth, vh = innerHeight, ww = W * s, hh = H * s;
  tx = ww < vw ? Math.min(Math.max(tx, 0), vw - ww) : Math.min(Math.max(tx, vw - ww - 90), 40);
  ty = hh < vh ? Math.min(Math.max(ty, 0), vh - hh) : Math.min(Math.max(ty, vh - hh - 60), 70); }
function apply() { clamp(); world.setAttribute('transform', `translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${s.toFixed(4)})`);
  const a = Math.max(0, -ty / s), b = Math.min(H, (innerHeight - ty) / s); vp.style.top = (a / H * 100) + '%'; vp.style.height = (Math.max(.01, b - a) / H * 100) + '%';
  if (sel) placePop(); }
function zoomAt(f, cx, cy) { const ns = Math.min(MAXS, Math.max(minS(), s * f)); tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply(); }
function animTo(s2, tx2, ty2, ms = 550) { cancelAnimationFrame(anim); const s0 = s, x0 = tx, y0 = ty, t0 = performance.now();
  const stepA = now => { const k = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - k, 3); s = s0 + (s2 - s0) * e; tx = x0 + (tx2 - x0) * e; ty = y0 + (ty2 - y0) * e; apply(); if (k < 1) anim = requestAnimationFrame(stepA); };
  anim = requestAnimationFrame(stepA); }
function homeView() { const vw = innerWidth, s2 = Math.min(1.1, Math.max(.55, (vw - 100) / W)); return [s2, (vw - 80) / 2 - W / 2 * s2, 90]; }
function fitView() { const s2 = minS(); return [s2, (innerWidth - W * s2) / 2, (innerHeight - H * s2) / 2]; }

const pts = new Map(); let down = null, moved = false, pinch0 = null;
const pinchState = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, s, tx, ty }; };
svg.addEventListener('pointerdown', e => { cancelAnimationFrame(anim); svg.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { down = { x: e.clientX, y: e.clientY, tx, ty, target: e.target }; moved = false; } else if (pts.size === 2) { pinch0 = pinchState(); moved = true; } });
svg.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1 && down) { const dx = e.clientX - down.x, dy = e.clientY - down.y; if (!moved && Math.hypot(dx, dy) > 6) { moved = true; svg.classList.add('drag'); }
    if (moved) { tx = down.tx + dx; ty = down.ty + dy; apply(); } }
  else if (pts.size === 2 && pinch0) { const p = pinchState(), ns = Math.min(MAXS, Math.max(minS(), pinch0.s * p.d / pinch0.d));
    tx = p.cx - (pinch0.cx - pinch0.tx) * ns / pinch0.s; ty = p.cy - (pinch0.cy - pinch0.ty) * ns / pinch0.s; s = ns; apply(); } });
function endPtr(e) { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); svg.classList.remove('drag');
  if (pts.size === 0) { if (down && !moved && e.type === 'pointerup') tap(down.target); down = null; pinch0 = null; }
  else if (pts.size === 1) { const [p] = [...pts.values()]; down = { x: p.x, y: p.y, tx, ty, target: null }; pinch0 = null; } }
svg.addEventListener('pointerup', endPtr); svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e => { e.preventDefault(); cancelAnimationFrame(anim);
  if (e.ctrlKey) { zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY); return; }
  if (e.shiftKey) { ty -= e.deltaY; tx -= e.deltaX; apply(); return; }
  ty -= e.deltaY; apply(); }, { passive: false });
const zc = () => [innerWidth / 2, innerHeight / 2];
document.getElementById('zin').onclick = () => { const [cx, cy] = zc(), ns = Math.min(MAXS, s * 1.4); animTo(ns, cx - (cx - tx) * ns / s, cy - (cy - ty) * ns / s, 300); };
document.getElementById('zout').onclick = () => { const [cx, cy] = zc(), ns = Math.max(minS(), s / 1.4); animTo(ns, cx - (cx - tx) * ns / s, cy - (cy - ty) * ns / s, 300); };
document.getElementById('zfit').onclick = () => animTo(...fitView());
document.getElementById('ztop').onclick = () => animTo(...homeView());
addEventListener('keydown', e => { const k = e.key;
  if (k === 'ArrowDown' || k === 'PageDown') { ty -= k === 'PageDown' ? innerHeight * .8 : 90; apply(); }
  else if (k === 'ArrowUp' || k === 'PageUp') { ty += k === 'PageUp' ? innerHeight * .8 : 90; apply(); }
  else if (k === 'ArrowLeft') { tx += 90; apply(); } else if (k === 'ArrowRight') { tx -= 90; apply(); }
  else if (k === '+' || k === '=') zoomAt(1.25, ...zc()); else if (k === '-') zoomAt(0.8, ...zc());
  else if (k === 'Escape') closePop(); else if (k === 'Home') animTo(...homeView()); });
// the strip doubles as a scroll bar: tap or drag to jump
let stripDrag = false;
const stripJump = e => { const r = strip.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)); cancelAnimationFrame(anim); ty = innerHeight / 2 - f * H * s; apply(); };
strip.addEventListener('pointerdown', e => { stripDrag = true; strip.setPointerCapture(e.pointerId); stripJump(e); });
strip.addEventListener('pointermove', e => { if (stripDrag) stripJump(e); });
strip.addEventListener('pointerup', () => stripDrag = false); strip.addEventListener('pointercancel', () => stripDrag = false);

/* ============ TAP A NODE → TINY POPUP ============ */
const pop = document.getElementById('pop'), popBody = document.getElementById('popBody'); let sel = null;
function related(id) { const set = new Set([id]); const up = i => byId[i].p.forEach(p => { if (!set.has(p)) { set.add(p); up(p); } }); const dn = i => byId[i].kids.forEach(c => { if (!set.has(c)) { set.add(c); dn(c); } });
  const A = new Set(), D = new Set(); up(id); set.forEach(x => A.add(x)); const set2 = new Set([id]); const dn2 = i => byId[i].kids.forEach(c => { if (!set2.has(c)) { set2.add(c); dn2(c); } }); dn2(id); return [A, set2]; }
function tap(target) { const g = target && target.closest ? target.closest('.node') : null; if (!g) { closePop(); return; } const id = g.dataset.id; if (sel === id) { closePop(); return; } openPop(id); }
function openPop(id) { sel = id; const n = byId[id], c = SC[n.s];
  popBody.innerHTML = `<b>${n.name}</b><div class="chip"><i style="background:${c};box-shadow:0 0 6px ${c}"></i>${SN[n.s]}</div>` + n.info.slice(0, 3).map(l => `<div>${l}</div>`).join('');
  pop.style.borderColor = c; pop.style.boxShadow = `0 0 24px ${c}44`; pop.style.display = 'block';
  const [A, D] = related(id); svg.classList.add('focus');
  svg.querySelectorAll('.node').forEach(el => el.classList.toggle('lit', A.has(el.dataset.id) || D.has(el.dataset.id)));
  svg.querySelectorAll('.edge').forEach(el => { const a = el.dataset.a, b = el.dataset.b; el.classList.toggle('lit', (A.has(a) && A.has(b)) || (D.has(a) && D.has(b))); });
  placePop(); }
function placePop() { const n = byId[sel], x = n.x * s + tx, y = n.y * s + ty, r = 46 * s, pw = pop.offsetWidth, ph = pop.offsetHeight, vw = innerWidth, vh = innerHeight;
  let px = x + r + 12; if (px + pw > vw - 84) px = x - r - 12 - pw; if (px < 8) px = Math.min(vw - pw - 8, Math.max(8, x - pw / 2));
  let py = y - ph / 2; if (px === Math.min(vw - pw - 8, Math.max(8, x - pw / 2))) py = y + r + 10; py = Math.min(vh - ph - 8, Math.max(8, py));
  pop.style.left = px + 'px'; pop.style.top = py + 'px'; }
function closePop() { sel = null; pop.style.display = 'none'; svg.classList.remove('focus'); }
pop.querySelector('.x').onclick = closePop;

/* ============ START ============ */
function init() { drawSky(); [s, tx, ty] = homeView(); apply(); }
addEventListener('resize', () => { drawSky(); apply(); });
init();
// test hook (used for screenshots): #view=fit or #y=<row>&z=<zoom>
(() => { const h = new URLSearchParams(location.hash.slice(1)); if (h.get('view') === 'fit') [s, tx, ty] = fitView();
  if (h.has('y')) { s = +(h.get('z') || s); ty = innerHeight / 2 - Y(+h.get('y')) * s; tx = (innerWidth - 80) / 2 - W / 2 * s; }
  apply(); if (h.has('open')) openPop(h.get('open')); })();
</script>
</body>
